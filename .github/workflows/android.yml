name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Print APK sizes
        run: ls -la app/build/outputs/apk/*/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: linguascreen-apks
          path: app/build/outputs/apk/**/*.apk
      - name: Publish debug APK as a GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LinguaScreen-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest LinguaScreen-debug.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "LinguaScreen debug build" \
            --notes "Debug APK built from commit $GITHUB_SHA. Untested on device."

  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Instrumented tests on an emulator (real download, OCR, translation, UI flow)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0 ; ./gradlew connectedDebugAndroidTest --stacktrace ; G=$? ; echo "GRADLE_EXIT=$G" ; adb logcat -d -s LinguaTest:I AndroidRuntime:E > logcat.txt ; cat logcat.txt ; adb pull /sdcard/Download/lingua_e2e.png . || true ; exit $G
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            logcat.txt
            lingua_e2e.png
            app/build/reports/androidTests/**
