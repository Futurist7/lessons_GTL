name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Print APK sizes
        run: ls -la app/build/outputs/apk/*/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: linguascreen-apks
          path: app/build/outputs/apk/**/*.apk
      - name: Publish debug APK as a GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LinguaScreen-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest LinguaScreen-debug.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "LinguaScreen debug build" \
            --notes "Debug APK built from commit $GITHUB_SHA. Untested on device."
